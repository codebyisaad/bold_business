[project]
name = "techforce"
version = "0.1.0"
description = "TechForce candidate import and scoped recruiter view"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.161.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend"
module-name = "app"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
